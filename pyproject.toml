[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aspire-agent"
version = "0.1.0"
description = "ASPIRE Agent toolkit for Aspen Plus MIXER and HEATER workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Zhou Xiaochi"}, {name = "Gao Yunhu"}]
dependencies = []

[project.optional-dependencies]
http = ["httpx>=0.25"]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
windows = ["pywin32>=306; platform_system == 'Windows'"]
llm = ["openai>=1.0"]
test = ["pytest>=8", "httpx>=0.25"]
dev = ["aspire-agent[http,server,test]"]

[project.scripts]
task-agent = "aspire_agent.cli:task_main"
thesis-agent = "aspire_agent.cli:thesis_main"
aspire-server = "aspire_agent.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aspire_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
